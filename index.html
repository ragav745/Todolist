<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f0e8" />
  <title>Daylist | A calmer to-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="." aria-label="Daylist home">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>daylist</span>
      </a>
      <p class="date-label" id="dateLabel"></p>
    </header>

    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow">Your daily rhythm</p>
      <h1 id="pageTitle">Make room for<br /><em>what matters.</em></h1>
      <p class="intro-copy">A simple place to collect the little things and keep moving.</p>
    </section>

    <section class="workspace" aria-label="To-do list">
      <div class="list-toolbar">
        <div>
          <h2>Today's list</h2>
          <p id="progressText">0 things to do</p>
        </div>
        <button class="clear-button" id="clearCompleted" type="button">Clear done</button>
      </div>

      <form class="add-form" id="addForm">
        <label class="sr-only" for="taskInput">Add a task</label>
        <input id="taskInput" type="text" maxlength="120" placeholder="What needs doing?" autocomplete="off" />
        <button class="add-button" type="submit" aria-label="Add task">+</button>
      </form>

      <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
        <button class="filter-tab is-active" type="button" role="tab" aria-selected="true" data-filter="all">All <span id="allCount">0</span></button>
        <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="active">Open <span id="activeCount">0</span></button>
        <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="completed">Done <span id="completedCount">0</span></button>
      </div>

      <ul class="task-list" id="taskList" aria-live="polite"></ul>
      <div class="empty-state" id="emptyState" hidden>
        <span class="empty-icon" aria-hidden="true">◌</span>
        <p id="emptyTitle">Your list is clear.</p>
        <span id="emptyHint">Add something small to get started.</span>
      </div>
    </section>

    <footer class="footer-note">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="footerStatus">Saved in your browser</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
